packages:
  - 'packages/**'
  - 'apps/**'
  # ubean writes a runtime package.json into `dist/server`; keep build output out of the workspace.
  - '!apps/**/dist/**'
  - 'skills'
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  vite-plus: ^0.3.0
  typescript: ^7.0.2
catalogs:
  ts6:
    typescript: ^6.0.3
overrides:
  vite: 'catalog:'
shamefullyHoist: true
ignoreWorkspaceRootCheck: true
linkWorkspacePackages: true
allowBuilds:
  esbuild: false
  maplibre-gl: false
minimumReleaseAge: 0
